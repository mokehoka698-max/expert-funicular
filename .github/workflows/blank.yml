name: Windows 7 KVM Test with SFTP

on:
  workflow_dispatch:
    inputs:
      vm_ram:
        description: 'VM RAM in MB'
        required: false
        default: '2048'
      vm_cpu:
        description: 'VM CPU cores'
        required: false
        default: '2'

jobs:
  win7-kvm-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check KVM readiness
      run: |
        echo "=== KVM Module Status ==="
        lsmod | grep -E "kvm|ccp|irqbypass"
        echo ""
        echo "=== KVM Device ==="
        ls -la /dev/kvm
        echo ""
        echo "=== CPU Virtualization ==="
        if grep -E "svm|vmx" /proc/cpuinfo > /dev/null; then
          echo "✅ AMD-V/Intel VT-x supported"
        else
          echo "❌ No virtualization support"
          exit 1
        fi

    - name: Install KVM and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-kvm \
          qemu-system-x86 \
          libvirt-daemon-system \
          libvirt-clients \
          bridge-utils \
          virtinst \
          wget \
          curl \
          sshpass \
          lftp
        sudo usermod -aG kvm $USER
        sudo systemctl start libvirtd

    - name: Download Windows 7 ISO from SFTP
      env:
        SFTP_USER: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_PATH: ${{ secrets.SFTP_PATH }}
      run: |
        echo "=== Downloading Windows 7 ISO from SFTP ==="
        
        # Using sshpass with sftp
        export SSHPASS="$SFTP_PASSWORD"
        
        # Download using sftp with sshpass
        sshpass -e sftp -o StrictHostKeyChecking=no "$SFTP_USER@$SFTP_HOST" <<EOF
        get $SFTP_PATH /tmp/Win7_HomePrem_SP1_English_x64.iso
        bye
        EOF
        
        # Alternative using lftp (more reliable)
        # lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://$SFTP_HOST -e "get $SFTP_PATH -o /tmp/Win7_HomePrem_SP1_English_x64.iso; quit"
        
        if [ -f /tmp/Win7_HomePrem_SP1_English_x64.iso ]; then
          echo "✅ ISO downloaded successfully"
          ls -lh /tmp/Win7_HomePrem_SP1_English_x64.iso
        else
          echo "❌ Failed to download ISO"
          exit 1
        fi

    - name: Create Windows 7 VM disk
      run: |
        echo "=== Creating VM Disk ==="
        qemu-img create -f qcow2 win7.qcow2 30G
        echo "✅ Disk created"

    - name: Run Windows 7 with KVM
      run: |
        echo "=== Starting Windows 7 VM ==="
        
        # Run QEMU with KVM
        sudo qemu-system-x86_64 \
          -enable-kvm \
          -cpu host,kvm=off,hv_vapic,hv_relaxed,hv_spinlocks=0x1fff,hv_time \
          -smp cores=${{ github.event.inputs.vm_cpu || 2 }},threads=1 \
          -m ${{ github.event.inputs.vm_ram || 2048 }} \
          -drive file=win7.qcow2,format=qcow2,if=virtio \
          -drive file=/tmp/Win7_HomePrem_SP1_English_x64.iso,media=cdrom \
          -netdev user,id=net0 \
          -device virtio-net,netdev=net0 \
          -vga vmware \
          -vnc :0 \
          -daemonize
        
        sleep 5
        echo "✅ Windows 7 VM started with KVM"
        echo "VNC available at: localhost:5900"

    - name: Monitor VM
      run: |
        echo "=== VM Status ==="
        ps aux | grep qemu | grep -v grep || echo "QEMU process not found"
        echo ""
        echo "=== System Resources ==="
        free -h
        echo ""
        echo "=== KVM Stats ==="
        sudo cat /sys/kernel/debug/kvm/* 2>/dev/null | head -20 || echo "KVM debug not available"

    - name: Wait and cleanup
      if: always()
      run: |
        echo "=== Waiting for VM to run ==="
        sleep 300  # Let VM run for 5 minutes
        
        echo "=== Stopping VM ==="
        sudo pkill -f qemu-system-x86_64 || true
        rm -f win7.qcow2 /tmp/Win7_HomePrem_SP1_English_x64.iso
        echo "✅ Cleanup complete"
