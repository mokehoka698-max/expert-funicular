name: Windows 7 KVM with FTP Download & noVNC

on:
  workflow_dispatch:
    inputs:
      vm_ram:
        description: 'VM RAM in MB'
        required: false
        default: '2048'
      vm_cpu:
        description: 'VM CPU cores'
        required: false
        default: '2'
      vm_disk_size:
        description: 'VM Disk Size in GB'
        required: false
        default: '30'

jobs:
  win7-kvm-novnc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    # ============================================
    # 1. SYSTEM VALIDATION
    # ============================================
    - name: Check KVM readiness
      id: kvm-check
      run: |
        echo "=== KVM Module Status ==="
        lsmod | grep -E "kvm|ccp|irqbypass" || echo "KVM modules not loaded"
        echo ""
        echo "=== KVM Device ==="
        ls -la /dev/kvm
        echo ""
        echo "=== CPU Virtualization ==="
        if grep -E "svm|vmx" /proc/cpuinfo > /dev/null; then
          echo "✅ AMD-V/Intel VT-x supported"
          grep -E "svm|vmx" /proc/cpuinfo | head -3
          echo "kvm-status=supported" >> $GITHUB_OUTPUT
        else
          echo "❌ No virtualization support"
          exit 1
        fi
        
        # Check available disk space
        echo ""
        echo "=== Available Disk Space ==="
        df -h /

    # ============================================
    # 2. INSTALL DEPENDENCIES
    # ============================================
    - name: Install KVM, noVNC, and Cloudflare
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-kvm \
          qemu-system-x86 \
          qemu-utils \
          libvirt-daemon-system \
          libvirt-clients \
          bridge-utils \
          virtinst \
          wget \
          curl \
          git \
          novnc \
          websockify \
          python3-numpy \
          dosfstools \
          ntfs-3g \
          lsof

        # Install Cloudflare Tunnel (cloudflared)
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        sudo chmod +x /usr/local/bin/cloudflared

        # Add user to kvm group
        sudo usermod -aG kvm $USER
        sudo systemctl start libvirtd
        sudo systemctl enable libvirtd

        echo "✅ All tools installed"
        qemu-system-x86_64 --version | head -1

    # ============================================
    # 3. DOWNLOAD WINDOWS 7 ISO VIA FTP
    # ============================================
    - name: Download Windows 7 ISO from FTP
      run: |
        echo "=== Downloading Windows 7 ISO from FTP Server ==="
        echo "Server: eu-central-1.sftpcloud.io"
        echo "File: /Win7_HomePrem_SP1_English_x64.iso"
        echo ""
        
        # Download using wget with FTP protocol
        wget --user="e2e659ab20164d5aaae048a28ffbcc72" \
             --password="GLbcGNceXpUZBpaB0Ic57VnYZN72myDz" \
             --progress=bar:force \
             --timeout=300 \
             --tries=3 \
             -O Win7_HomePrem_SP1_English_x64.iso \
             ftp://eu-central-1.sftpcloud.io/Win7_HomePrem_SP1_English_x64.iso

        # Verify download
        if [ -f Win7_HomePrem_SP1_English_x64.iso ]; then
          ISO_SIZE=$(ls -lh Win7_HomePrem_SP1_English_x64.iso | awk '{print $5}')
          echo ""
          echo "✅ ISO downloaded successfully"
          echo "   Size: $ISO_SIZE"
          echo "   Location: $(pwd)/Win7_HomePrem_SP1_English_x64.iso"
          
          # Validate it's an ISO file
          file Win7_HomePrem_SP1_English_x64.iso
        else
          echo "❌ Failed to download ISO"
          echo "Please check:"
          echo "  - FTP server is accessible"
          echo "  - Credentials are correct"
          echo "  - File exists at the specified path"
          exit 1
        fi

    # ============================================
    # 4. CLEAN UP ANY EXISTING VM PROCESSES
    # ============================================
    - name: Clean up existing VM processes
      run: |
        echo "=== Cleaning up existing VM processes ==="
        
        # Kill any existing QEMU processes
        sudo pkill -TERM -f qemu-system-x86_64 || true
        sleep 3
        sudo pkill -9 -f qemu-system-x86_64 || true
        
        # Remove any stale lock files
        sudo rm -f /var/lock/qemu* || true
        sudo rm -f /tmp/qemu* || true
        
        # Check if any process is using the disk
        echo "Checking for processes using win7.qcow2..."
        lsof | grep win7.qcow2 || echo "No processes using the disk"
        
        # Remove old disk if exists (to avoid lock issues)
        if [ -f win7.qcow2 ]; then
          echo "Removing old disk to avoid lock issues..."
          rm -f win7.qcow2
        fi
        
        echo "✅ Cleanup complete"

    # ============================================
    # 5. CREATE VIRTUAL DISK (30 GB)
    # ============================================
    - name: Create VM disk
      run: |
        echo "=== Creating VM Disk ==="
        echo "Disk Size: ${{ github.event.inputs.vm_disk_size || 30 }} GB"
        echo "Disk Format: QCOW2 (Copy-on-Write)"
        echo "Disk Path: $(pwd)/win7.qcow2"
        echo ""
        
        # Create the disk with specified size
        qemu-img create -f qcow2 win7.qcow2 ${{ github.event.inputs.vm_disk_size || 30 }}G
        
        # Verify disk creation
        if [ -f win7.qcow2 ]; then
          DISK_SIZE=$(ls -lh win7.qcow2 | awk '{print $5}')
          echo ""
          echo "✅ VM Disk created successfully"
          echo "   Size: $DISK_SIZE"
        else
          echo "❌ Failed to create VM disk"
          exit 1
        fi
        
        # Check available space after disk creation
        echo ""
        echo "=== Available Disk Space After Creation ==="
        df -h /

    # ============================================
    # 6. DOWNLOAD VIRTIO DRIVERS
    # ============================================
    - name: Download VirtIO drivers (optional)
      run: |
        echo "=== Downloading VirtIO Drivers ==="
        echo "VirtIO drivers improve disk and network performance in Windows 7"
        echo ""
        
        wget -q --timeout=60 -O virtio-win.iso \
          https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso 2>/dev/null || \
          echo "⚠️  VirtIO drivers download skipped (optional)"
        
        if [ -f virtio-win.iso ]; then
          echo "✅ VirtIO drivers downloaded: $(ls -lh virtio-win.iso)"
        else
          echo "ℹ️  VirtIO drivers not available - will use standard IDE/SATA"
        fi

    # ============================================
    # 7. START WINDOWS 7 VM WITH KVM AND NETWORK
    # ============================================
    - name: Start Windows 7 VM with KVM
      run: |
        echo "=== Starting Windows 7 VM with KVM ==="
        echo "Configuration:"
        echo "  CPU: ${{ github.event.inputs.vm_cpu || 2 }} cores"
        echo "  RAM: ${{ github.event.inputs.vm_ram || 2048 }} MB"
        echo "  Disk: ${{ github.event.inputs.vm_disk_size || 30 }} GB (QCOW2)"
        echo "  Network: User-mode (SLIRP) with port forwarding"
        echo "  VNC: :0 (port 5900)"
        echo ""

        # Build QEMU command with explicit drive configuration
        # Using -snapshot flag to prevent write locks for testing
        QEMU_CMD="sudo qemu-system-x86_64 \
          -enable-kvm \
          -cpu host,kvm=off,hv_vapic,hv_relaxed,hv_spinlocks=0x1fff,hv_time \
          -smp cores=${{ github.event.inputs.vm_cpu || 2 }},threads=1 \
          -m ${{ github.event.inputs.vm_ram || 2048 }} \
          -drive file=win7.qcow2,format=qcow2,if=virtio,index=0,media=disk,cache=writeback \
          -drive file=Win7_HomePrem_SP1_English_x64.iso,media=cdrom,index=1 \
          -netdev user,id=net0,hostfwd=tcp::3389-:3389,hostfwd=tcp::2222-:22 \
          -device virtio-net,netdev=net0 \
          -vga vmware \
          -vnc :0 \
          -daemonize"

        # Add VirtIO drivers if available as additional CD-ROM
        if [ -f virtio-win.iso ]; then
          QEMU_CMD="$QEMU_CMD -drive file=virtio-win.iso,media=cdrom,index=2"
          echo "✅ VirtIO drivers will be available as CD-ROM"
        fi

        # Execute QEMU
        echo "Starting VM..."
        eval $QEMU_CMD

        # Wait for VM to start
        sleep 10

        # Verify VM is running
        if ps aux | grep -q "[q]emu-system-x86_64"; then
          echo ""
          echo "✅ Windows 7 VM started successfully"
          echo ""
          echo "📊 VM Status:"
          echo "   Process ID: $(pgrep -f qemu-system-x86_64 | head -1)"
          echo "   Memory Used: $(ps aux | grep qemu-system-x86_64 | grep -v grep | awk '{print $4}')%"
          echo ""
          echo "📡 Network Ports Forwarded:"
          echo "   - RDP:  localhost:3389 → VM:3389"
          echo "   - SSH:  localhost:2222 → VM:22"
          echo ""
          echo "🖥️  VNC: localhost:5900"
        else
          echo "❌ Failed to start VM"
          exit 1
        fi

    # ============================================
    # 8. DISPLAY VM DISK INFORMATION (SAFE MODE)
    # ============================================
    - name: Display VM disk information
      run: |
        echo "=== 💾 VM Disk Information ==="
        echo ""
        
        # Check if disk exists
        if [ -f win7.qcow2 ]; then
          echo "Disk File: win7.qcow2"
          echo "File Size: $(ls -lh win7.qcow2 | awk '{print $5}')"
          echo ""
          
          # Try to get disk info without locking
          echo "QCOW2 Disk Info (read-only):"
          sudo qemu-img info --force-share win7.qcow2 2>/dev/null || \
            qemu-img info win7.qcow2 2>/dev/null || \
            echo "  ℹ️  Disk is in use - showing basic info only"
          
          echo ""
          echo "Disk Usage:"
          du -sh win7.qcow2 2>/dev/null || echo "  Cannot determine usage (disk in use)"
        else
          echo "❌ Disk file not found"
        fi
        
        echo ""
        echo "Available Space on Host:"
        df -h /

    # ============================================
    # 9. SETUP NOVNC
    # ============================================
    - name: Setup noVNC
      run: |
        echo "=== Setting up noVNC ==="

        # Clone noVNC
        git clone --depth=1 https://github.com/novnc/noVNC.git
        git clone --depth=1 https://github.com/novnc/websockify.git

        # Start websockify to bridge VNC to WebSocket
        cd websockify
        nohup sudo python3 -m websockify --web ../noVNC 8080 localhost:5900 > /tmp/novnc.log 2>&1 &
        cd ..

        # Wait for noVNC to start
        sleep 5

        if ps aux | grep -q "[w]ebsockify"; then
          echo "✅ noVNC running on port 8080"
          echo "   WebSocket bridge: localhost:8080"
        else
          echo "⚠️  noVNC failed to start"
          cat /tmp/novnc.log
        fi

    # ============================================
    # 10. START CLOUDFLARE TUNNEL
    # ============================================
    - name: Start Cloudflare Tunnel
      run: |
        echo "=== Starting Cloudflare Tunnel ==="

        # Start cloudflared tunnel
        nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate \
          > cloudflare.log 2>&1 &

        # Wait for tunnel to establish
        sleep 15

        # Extract the tunnel URL
        TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare.com' cloudflare.log | head -1)

        if [ -n "$TUNNEL_URL" ]; then
          echo "✅ Cloudflare Tunnel established"
          echo ""
          echo "🌐 NOVNC ACCESS URL: $TUNNEL_URL/vnc.html"
          echo ""
          echo "📝 Instructions:"
          echo "   1. Open the URL above in your browser"
          echo "   2. Click 'Connect' in the noVNC interface"
          echo "   3. You will see the Windows 7 installation screen"
          echo ""
          echo "🔗 Tunnel URL saved to GITHUB_ENV"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        else
          echo "⚠️  Cloudflare Tunnel failed to start"
          echo "Check cloudflare.log for details:"
          cat cloudflare.log
        fi

    # ============================================
    # 11. DISPLAY CONNECTION AND DISK INFO
    # ============================================
    - name: Display connection and disk information
      run: |
        echo "=== 📊 CONNECTION & DISK INFORMATION ==="
        echo ""
        echo "🌐 Web Access (noVNC via Cloudflare):"
        if [ -n "$TUNNEL_URL" ]; then
          echo "   URL: $TUNNEL_URL/vnc.html"
        else
          echo "   ⚠️  Tunnel not available (check logs)"
        fi
        echo ""
        echo "🖥️  VNC Direct Access:"
        echo "   Address: localhost:5900"
        echo "   Password: (none)"
        echo ""
        echo "🔌 RDP Access (once Windows is installed):"
        echo "   Address: localhost:3389"
        echo "   Username: (Windows credentials)"
        echo ""
        echo "🔌 SSH Access (if enabled in Windows):"
        echo "   Address: localhost:2222"
        echo ""
        echo "💾 VM Disk:"
        echo "   File: $(pwd)/win7.qcow2"
        echo "   Size: ${{ github.event.inputs.vm_disk_size || 30 }} GB"
        echo "   Format: QCOW2"
        if [ -f win7.qcow2 ]; then
          echo "   Actual Usage: $(du -h win7.qcow2 2>/dev/null | cut -f1 || echo 'N/A')"
        fi
        echo ""
        echo "📂 ISO Files:"
        echo "   Windows 7: $(pwd)/Win7_HomePrem_SP1_English_x64.iso"
        echo "   Size: $(ls -lh Win7_HomePrem_SP1_English_x64.iso | awk '{print $5}')"
        if [ -f virtio-win.iso ]; then
          echo "   VirtIO: $(pwd)/virtio-win.iso"
          echo "   Size: $(ls -lh virtio-win.iso | awk '{print $5}')"
        fi
        echo ""

    # ============================================
    # 12. MONITOR SERVICES
    # ============================================
    - name: Monitor services
      run: |
        echo "=== 🔍 Service Status ==="
        echo ""
        echo "QEMU Process:"
        ps aux | grep "[q]emu-system-x86_64" || echo "  ❌ Not running"
        echo ""
        echo "noVNC Process:"
        ps aux | grep "[w]ebsockify" || echo "  ❌ Not running"
        echo ""
        echo "Cloudflare Tunnel Process:"
        ps aux | grep "[c]loudflared" || echo "  ❌ Not running"
        echo ""
        echo "=== System Resources ==="
        free -h
        echo ""
        echo "=== VM Disk Usage ==="
        df -h $(pwd) 2>/dev/null || echo "Cannot determine disk usage"

    # ============================================
    # 13. KEEP SERVICES ALIVE
    # ============================================
    - name: Keep services running
      run: |
        echo "=== ⏳ Keeping services running ==="
        echo "The VM will continue running until the job is cancelled"
        echo ""
        echo "To access the VM:"
        if [ -n "$TUNNEL_URL" ]; then
          echo "  🌐 Open: $TUNNEL_URL/vnc.html"
        fi
        echo "  🖥️  Or use VNC client: localhost:5900"
        echo ""
        echo "💾 Disk Status:"
        if [ -f win7.qcow2 ]; then
          echo "  Current usage: $(du -h win7.qcow2 2>/dev/null | cut -f1 || echo 'N/A') / ${{ github.event.inputs.vm_disk_size || 30 }} GB"
        fi
        echo ""
        echo "⏱️  Press 'Cancel workflow' in GitHub Actions to stop"
        echo ""

        # Keep the job running
        while true; do
          sleep 60
          # Check if QEMU is still running
          if ! ps aux | grep -q "[q]emu-system-x86_64"; then
            echo "⚠️  WARNING: QEMU VM stopped unexpectedly at $(date)"
            echo "Check logs above for details"
            break
          fi
          # Display disk usage every 5 minutes
          if [ $((SECONDS % 300)) -eq 0 ] && [ -f win7.qcow2 ]; then
            echo "📊 Disk usage at $(date): $(du -h win7.qcow2 2>/dev/null | cut -f1 || echo 'N/A')"
          fi
          echo "✅ Services running - $(date)"
        done

    # ============================================
    # 14. COLLECT LOGS
    # ============================================
    - name: Collect logs
      if: always()
      run: |
        echo "=== 📋 Collecting logs ==="
        
        echo "QEMU logs:"
        sudo journalctl -u libvirtd --no-pager | tail -20 || echo "No libvirt logs"
        echo ""
        
        echo "Cloudflare logs:"
        if [ -f cloudflare.log ]; then
          cat cloudflare.log
        else
          echo "No Cloudflare logs"
        fi
        echo ""
        
        echo "noVNC logs:"
        if [ -f /tmp/novnc.log ]; then
          cat /tmp/novnc.log
        else
          echo "No noVNC logs"
        fi

    # ============================================
    # 15. CLEANUP
    # ============================================
    - name: Cleanup
      if: always()
      run: |
        echo "=== 🧹 Cleaning up ==="
        
        # Stop VM gracefully
        echo "Stopping VM..."
        sudo pkill -TERM -f qemu-system-x86_64 || true
        sleep 3
        sudo pkill -9 -f qemu-system-x86_64 || true
        
        # Stop noVNC
        echo "Stopping noVNC..."
        sudo pkill -f websockify || true
        
        # Stop Cloudflare Tunnel
        echo "Stopping Cloudflare Tunnel..."
        sudo pkill -f cloudflared || true
        
        # Remove lock files
        sudo rm -f /var/lock/qemu* || true
        sudo rm -f /tmp/qemu* || true
        
        # Remove files
        echo "Removing files..."
        rm -f win7.qcow2 Win7_HomePrem_SP1_English_x64.iso virtio-win.iso
        rm -rf noVNC websockify
        rm -f cloudflare.log /tmp/novnc.log
        
        echo "✅ Cleanup complete"

    # ============================================
    # 16. FINAL STATUS
    # ============================================
    - name: Final status
      if: always()
      run: |
        echo "=== 🏁 Workflow Summary ==="
        echo ""
        echo "Status: ${{ job.status }}"
        echo "ISO: Win7_HomePrem_SP1_English_x64.iso"
        echo "Disk: 30 GB QCOW2"
        echo "KVM: ${{ steps.kvm-check.outputs.kvm-status || 'Unknown' }}"
        echo ""
        echo "Access Methods:"
        if [ -n "$TUNNEL_URL" ]; then
          echo "  ✅ Cloudflare Tunnel: $TUNNEL_URL/vnc.html"
        else
          echo "  ❌ Cloudflare Tunnel: Not available"
        fi
        echo "  ✅ VNC Direct: localhost:5900"
        echo "  ✅ RDP: localhost:3389"
        echo "  ✅ SSH: localhost:2222"
        echo ""
        echo "Job started: ${{ github.event.created_at }}"
        echo "Runner: ${{ runner.name }}"
        echo "OS: ${{ runner.os }}"
